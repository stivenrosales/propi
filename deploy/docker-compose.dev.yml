# Local Postgres for development and the db test suites.
# Host port 55433 (55432 is commonly taken by other local stacks).
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   DATABASE_URL=postgresql://propi:propi@localhost:55433/propi pnpm test
name: propi-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: propi
      POSTGRES_PASSWORD: propi
      POSTGRES_DB: propi
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propi -d propi"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - propi-dev-pg:/var/lib/postgresql/data
volumes:
  propi-dev-pg:
